name: Build APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android/pi-remote-control-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/pi-remote-control-app/**/*.gradle*', 'android/pi-remote-control-app/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Compute the same versionCode build.gradle.kts uses (git commit count
      # on the checked-out ref) so we can stamp it into the artifact name and
      # release body. The in-app updater reads versionCode from the release
      # body to decide whether the user is out of date — no need to download
      # the APK just to check.
      - name: Compute versionCode / versionName
        id: ver
        working-directory: ${{ github.workspace }}
        run: |
          # checkout@v4 does a shallow clone by default — need full history
          # for `git rev-list --count`.
          git fetch --unshallow || true
          CODE=$(git rev-list --count HEAD)
          NAME=$(git rev-parse --short=8 HEAD)
          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$NAME" >> "$GITHUB_OUTPUT"

      - name: Rename APK with versionCode
        working-directory: android/pi-remote-control-app/app/build/outputs/apk/debug
        run: |
          mv app-debug.apk "pi-remote-v${{ steps.ver.outputs.versionCode }}.apk"

      - name: Publish to "latest" release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          # versionCode / versionName lines are parsed by the in-app updater
          # (case-sensitive). Don't reword without bumping the updater.
          body: |
            Auto-built debug APK from commit ${{ github.sha }}.
            Triggered by ${{ github.event_name }} on ${{ github.ref_name }}.

            versionCode: ${{ steps.ver.outputs.versionCode }}
            versionName: ${{ steps.ver.outputs.versionName }}
          prerelease: true
          make_latest: "false"
          files: android/pi-remote-control-app/app/build/outputs/apk/debug/pi-remote-v${{ steps.ver.outputs.versionCode }}.apk
